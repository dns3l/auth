{{ template "header.html" . }}

        <main class="card">
          <div>
            <h1>Choose a method</h1>
            <p class="lede">Log in to {{ issuer }} with one of the following.</p>
          </div>

          <!-- Dex fills .Connectors from the configuration. This page is only
               reached when more than one connector exists; with a single one
               Dex goes straight to that connector's own page. -->
          <div class="conns">
            {{ range $c := .Connectors }}
              <a class="btn ghost conn" href="{{ $c.URL }}" target="_self">
                <span>{{ $c.Name }}</span>
                <!-- The connector type tells an admin which backend answers,
                     which is useful while several are being rolled out. -->
                <small>{{ $c.Type }}</small>
              </a>
            {{ end }}
          </div>

          <p class="hint">
            Trouble signing in? <a href='{{ "helpURL" | extra }}'>Contact your admin</a>
          </p>
        </main>

{{ template "footer.html" . }}
