<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ issuer }}</title>
    <!-- Self-hosted theme; nothing is loaded from a CDN, so the page also
         renders in an air-gapped network. -->
    <link rel="icon" href="{{ url .ReqPath "theme/favicon.svg" }}">
    <link rel="stylesheet" href="{{ url .ReqPath "theme/styles.css" }}">
  </head>

  <body>
    <div class="shell">

      <!-- Left: what DNS3L is. Hidden when the visitor turns the intro off. -->
      <section class="intro" aria-label="About DNS3L">
        <a class="wordmark" href='{{ "clientURL" | extra }}' aria-label="DNS3L home">
          DNS<sup>3L</sup>
        </a>

        <h2>Certificates for your app, without tickets.</h2>

        <p>
          Manual certificates expire unnoticed and cost hours of tickets,
          waiting and copy-paste.
          <strong>DNS3L claims, renews and delivers your X.509 certificates
          automatically, in under a minute.</strong>
        </p>

        <figure class="preview" aria-label="DNS3L app preview">
          <!-- Opens the app in demo mode: mock data, no account, nothing is
               issued. Without demoURL the badge below is omitted and the
               screenshot is not a link. -->
          <a class="shot" href='{{ "demoURL" | extra }}' aria-label="Try the demo">
            <div class="shot-bar">
              <i></i><i></i><i></i>
              <span class="shot-url">https://dns3l.example.com</span>
            </div>
            <div class="shot-frames">
              <img src="{{ url .ReqPath "static/img/step-2-ca.webp" }}" alt="">
              <img src="{{ url .ReqPath "static/img/step-3-claim.webp" }}" alt="">
              <img src="{{ url .ReqPath "static/img/step-4-validate.webp" }}" alt="">
              <img src="{{ url .ReqPath "static/img/step-5-download.webp" }}" alt="">
            </div>
            {{ if extra "demoURL" }}
              <span class="play"><i>▶</i>Try demo</span>
            {{ end }}
          </a>

          <figcaption class="caption">
            <span class="steps">
              <span>1 - Pick a CA</span>
              <span>2 - Claim your certificate</span>
              <span>3 - Issued in under a minute</span>
              <span>4 - Implement into your application & manage it</span>
            </span>
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </figcaption>

          <div class="ctas">
            <a class="cta" href='{{ "clientURL" | extra }}'>
              <i>🛠</i>
              <span><b>What is DNS3L</b><small>for Technicians</small></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14" /><path d="m13 6 6 6-6 6" />
              </svg>
            </a>

            <!-- Not written yet. Give it an href and drop aria-disabled when it is. -->
            <a class="cta" aria-disabled="true" title="Coming soon">
              <i>📊</i>
              <span><b>Explanation</b><small>for Managers - soon</small></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14" /><path d="m13 6 6 6-6 6" />
              </svg>
            </a>
          </div>
        </figure>
      </section>

      <!-- Right: whatever page Dex is rendering goes in here. -->
      <section class="panel" aria-label="Log in">
