{{ template "header.html" . }}

        <main class="card">
          <div>
            <h1>Welcome 😎</h1>
            <p class="lede">Log in with your account.</p>
          </div>

          <!-- The contract with Dex: POST to .PostURL, fields named
               login and password. Everything else here is presentation. -->
          <form id="frm" method="post" action="{{ .PostURL }}">
            <label class="field" for="login">
              <span>{{ .UsernamePrompt }}</span>
              <span class="input">
                <input id="login" name="login" type="text" required autocapitalize="off"
                       autocomplete="username" placeholder="jane.doe"
                       {{ if .Username }}value="{{ .Username }}"{{ else }}autofocus{{ end }}>
              </span>
            </label>

            <label class="field" for="password">
              <span>
                Password
                <!-- Dex has no password reset; this opens the AD self-service portal. -->
                <a href='{{ "passwordResetURL" | extra }}' target="_blank" rel="noopener">
                  Forgot password?
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 4h6v6" /><path d="M20 4 10 14" />
                    <path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5" />
                  </svg>
                </a>
              </span>
              <span class="input with-button">
                <input id="password" name="password" type="password"
                       autocomplete="current-password" placeholder=""
                       {{ if .Invalid }}autofocus{{ end }}>
                <button type="button" class="reveal" id="reveal" aria-label="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </span>
            </label>

            <button type="submit" class="btn">Log in</button>

            {{ if .BackLink }}
              <a class="btn ghost" href="{{ .BackLink }}">Another method</a>
            {{ end }}
          </form>

          {{ if .Invalid }}
            <div class="alert" role="alert">
              <span aria-hidden="true">⚠️</span>
              <span>
                <b>Login failed</b>
                Invalid {{ .UsernamePrompt }} or password.
              </span>
            </div>
          {{ end }}

          <div>
            <div class="sep"><i></i>or continue with<b>Soon</b><i></i></div>
            <div class="providers">
              <!-- These appear for real only when the connectors exist in the
                   Dex configuration; until then they are placeholders. -->
              <button type="button" disabled aria-disabled="true" title="Coming soon">Google</button>
              <button type="button" disabled aria-disabled="true" title="Coming soon">Apple</button>
              <button type="button" disabled aria-disabled="true" title="Coming soon">SSO</button>
              <button type="button" disabled aria-disabled="true" title="Coming soon">GitHub</button>
            </div>
          </div>

          <p class="hint">
            Trouble signing in? <a href='{{ "helpURL" | extra }}'>Contact your admin</a>
          </p>

          <!-- The label is the control: a button must not wrap a checkbox,
               and the checkbox is what the CSS below reads the state from. -->
          <label class="skip">
            <!-- First in the DOM so the CSS sibling selectors can reach every
                 other part of the row. Hidden visually, not removed, so the
                 switch stays keyboard operable. -->
            <input type="checkbox" id="skip-intro" class="skip-input">

            <span class="skip-cat" aria-hidden="true">
              <!-- Switch off: the intro and the preview are on show, so the
                   cat is pleased. Switch on: they are gone, and she is not. -->
              <img class="cat cat-off" src="{{ url .ReqPath "static/img/cat-happy.webp" }}"
                   width="96" height="96" alt="">
              <img class="cat cat-on" src="{{ url .ReqPath "static/img/cat-grumpy.webp" }}"
                   width="96" height="96" alt="">
            </span>

            <span class="skip-text">
              <b>Skip the marketing</b>
              <small class="cap-off">Hide the intro, show only the login</small>
              <small class="cap-on">Intro hidden &ndash; remembered on this device</small>
            </span>

            <span class="track" aria-hidden="true"></span>
          </label>
        </main>

{{ template "footer.html" . }}
