      </section>
    </div>

    <script>
      // Show or hide the password. Kept tiny and inline: no bundler in this repo.
      (function () {
        var btn = document.getElementById('reveal');
        var input = document.getElementById('password');
        if (!btn || !input) return;
        btn.addEventListener('click', function () {
          var shown = input.type === 'text';
          input.type = shown ? 'password' : 'text';
          btn.setAttribute('aria-label', shown ? 'Show password' : 'Hide password');
        });
      })();

      // "Skip the marketing": hides the intro column and remembers the choice
      // in this browser. Purely cosmetic - it changes no authentication state.
      //
      // The switch is a real checkbox now, so this only mirrors the stored
      // value into it and back. Its appearance and the caption are handled by
      // CSS from the :checked state, which is why neither is touched here -
      // two places writing the same thing is how a switch ends up disagreeing
      // with itself.
      (function () {
        var KEY = 'dns3l.login.focus';
        var box = document.getElementById('skip-intro');
        var on = false;
        try { on = localStorage.getItem(KEY) === '1'; } catch (e) {}

        document.body.classList.toggle('focus', on);
        if (!box) return;
        box.checked = on;

        box.addEventListener('change', function () {
          on = box.checked;
          try { on ? localStorage.setItem(KEY, '1') : localStorage.removeItem(KEY); } catch (e) {}
          document.body.classList.toggle('focus', on);
        });
      })();
    </script>
  </body>
</html>
